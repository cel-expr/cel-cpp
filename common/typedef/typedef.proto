edition = "2023";

package cel.types;

import "cel/expr/checked.proto";
import "cel/expr/syntax.proto";

option cc_enable_arenas = true;

// Represents a collection of CEL type definitions.
message TypeDefSet {
  repeated TypeDef types = 1;
}

// Represents a single CEL type definition (either an object or an enum).
message TypeDef {
  oneof kind {
    Object object_type = 1;
    Enum enum_type = 2;
  }
}

// Represents a structured object type with typed fields.
message Object {
  message Field {
    string name = 1;
    cel.expr.Type type = 2;
    string doc = 3;
    cel.expr.Constant default_value = 4;

    extensions 1000 to max;
  }

  string name = 1;
  string doc = 2;
  repeated Field fields = 3;

  extensions 1000 to max;
}

// Represents a named enumeration type.
message Enum {
  message EnumConstant {
    string name = 1;
    int32 id = 2;
    string doc = 3;

    extensions 1000 to max;
  }

  string name = 1;
  string doc = 2;
  repeated EnumConstant constants = 3;

  extensions 1000 to max;
}
