# Root-package struct without file_name (synthesizes types.proto)
- struct:
    name: "GlobalConfig"
    doc: "Global config in root package."
    fields:
      - name: "config_id"
        type: "string"
        doc: "Config ID."
      - name: "timeout_seconds"
        type: "int"
        default: 30
        aspects:
          proto:
            type: "int32"
      - name: "max_connections"
        type: "uint"
        default: 100
      - name: "d_pi"
        type: "double"
        default: 3.141592653589793
      - name: "f_val"
        type: "double"
        default: 1.2345679
        aspects:
          proto:
            type: "float"
      - name: "d_inf"
        type: "double"
        default: inf
      - name: "d_neg_inf"
        type: "double"
        default: -inf
      - name: "d_nan"
        type: "double"
        default: nan
      - name: "f_neg_inf"
        type: "double"
        default: -inf
        aspects:
          proto:
            type: "float"
      - name: "f_nan"
        type: "double"
        default: nan
        aspects:
          proto:
            type: "float"
      - name: "enabled"
        type: "bool"
        default: true
      - name: "max_retries"
        type: "uint"
        default: 5
        aspects:
          proto:
            type: "uint32"
      - name: "default_label"
        type: "string"
        default: "prod"
      - name: "magic_header"
        type: "bytes"
        default: b"\x00\xffAB"

# Packaged types in com.example without file_name (synthesizes com/example/types.proto)
- struct:
    name: "com.example.Order"
    doc: "Order message."
    fields:
      - name: "order_id"
        type: "string"
        aspects:
          proto:
            id: 1
            json_name: "orderIdCustom"
      - name: "created_at"
        type: "timestamp"
      - name: "status"
        type: "com.example.OrderStatus"
      - one_of_fields:
          - name: "choice"
            type: "string"
            aspects:
              proto:
                id: 4
        aspects:
          proto:
            name: "selection"
      - name: "opt_description"
        type: "string"
      - name: "items"
        type: "map<string, int>"
      - name: "reserved_gap_field"
        type: "int"
        aspects:
          proto:
            id: 18999
      - name: "auto_after_reserved"
        type: "int"
      - name: "scores"
        type: "map<int, double>"
        aspects:
          proto:
            type: "map<int32, float>"
      - name: "previous_order"
        type: "com.example.LegacyOrder"
      - name: "tags"
        type: "list<string>"
      - name: "quantities"
        type: "list<int>"
        aspects:
          proto:
            type: "int32"
      - name: "nested_lists"
        type: "list<list<dyn>>"
      - name: "nested_structs"
        type: "list<map<string, dyn>>"
      - name: "extra_struct"
        type: "map<string, dyn>"
        aspects:
          proto:
            type: "google.protobuf.Struct"
      - name: "extra_list"
        type: "list<dyn>"
        aspects:
          proto:
            type: "google.protobuf.ListValue"
      - name: "dyn_val"
        type: "dyn"
      - name: "null_val"
        type: "null"
      - name: "any_val"
        type: "any"
      - name: "ttl"
        type: "duration"
      - name: "opt_bool"
        type: "bool_wrapper"
      - name: "opt_int"
        type: "int_wrapper"
      - name: "opt_uint"
        type: "uint_wrapper"
      - name: "opt_double"
        type: "double_wrapper"
      - name: "opt_string"
        type: "string_wrapper"
      - name: "opt_bytes"
        type: "bytes_wrapper"

- enum:
    name: "com.example.Order.Priority"
    aspects:
      proto:
        allow_alias: true
    constants:
      - name: "UNSPECIFIED"
        id: 0
      - name: "PRIMARY"
        id: 1
      - name: "DEFAULT"
        id: 1

# Chained proto.name override: CEL name matches LegacyOrder's proto.name
# ("com.example.ProtoLegacyOrder"), while its own proto.name is
# "ArchivedLegacyOrder".
- struct:
    name: "com.example.ProtoLegacyOrder"
    aspects:
      proto:
        name: "ArchivedLegacyOrder"
    fields:
      - name: "archive_id"
        type: "string"

- struct:
    name: "com.example.Order.ItemDetail"
    doc: "Nested item detail."
    fields:
      - name: "detail_id"
        type: "string"
      - name: "quantity"
        type: "int"

- enum:
    name: "com.example.OrderStatus"
    doc: "Order status."
    aspects:
      proto:
        name: "com.example.proto.ProtoOrderStatus"
    constants:
      - name: "UNSPECIFIED"
        id: 0
      - name: "ACTIVE"
        id: 1
        aspects:
          proto:
            name: "STATUS_ACTIVE"

# Packaged type with explicit file_name depending on com/example/types.proto
- struct:
    name: "com.example.LegacyOrder"
    doc: "Legacy order."
    aspects:
      proto:
        name: "ProtoLegacyOrder"
        file_name: "com/example/legacy_order.proto"
    fields:
      - name: "status"
        type: "com.example.OrderStatus"
        default: "ACTIVE"
        aspects:
          proto:
            name: "order_status"
      - name: "legacy_id"
        type: "string"
      - name: "celMetadata"
        type: "map<string, int>"
        aspects:
          proto:
            name: "proto_metadata"
      - one_of_fields:
          - name: "email"
            type: "string"
          - name: "phone"
            type: "string"
      - one_of_fields: []
      - one_of_fields:
          - name: "card"
            type: "string"
          - name: "cash"
            type: "bool"
        aspects:
          proto:
            name: "oneof_0"
