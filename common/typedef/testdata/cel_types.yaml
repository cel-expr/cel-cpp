# Struct with no fields
- struct:
    name: "NoFields"

# Enum with no constants
- enum:
    name: "NoConstants"

# Struct with aspects and defaults
- struct:
    name: "com.example.Item"
    doc: "Store item entity."
    aspects:
      aspect_a:
        name: "ItemObj"
      proto:
        name: "com.example.proto.Item"
      proto2:
        extension_ranges:
          - start: 100
            end: 200
    fields:
      - name: "item_id"
        type: "string"
        doc: "Unique item identifier."
        default: "default_id"
        aspects:
          aspect_a:
            name: "itemId"
          proto:
            id: 1
            json_name: "itemId"
          proto2:
            required: true
          proto3:
            optional: true
      - name: "tags"
        type: "list<string>"
        aspects:
          proto: {}
          proto2:
            packed: true
          proto3:
            packed: false
      - name: "attributes"
        type: "map<string, dyn>"
      - name: "nested_type"
        type: "list<~T>"

# All supported field types and default constant kinds (concise syntax)
- struct:
    name: "AllSupportedFieldTypes"
    fields:
      - name: "f_null"
        type: "null"
        default: ~
      - name: "f_null_empty"
        type: "null"
        default: ""
      - name: "f_bool"
        type: "bool"
        default: true
      - name: "f_bool_false"
        type: "bool"
        default: false
      - name: "f_int"
        type: "int"
        default: -42
      - name: "f_uint"
        type: "uint"
        default: 100u
      - name: "f_double"
        type: "double"
        default: 3.25
      - name: "f_bytes"
        type: "bytes"
        default: b"\xff\x00\x01"
      - name: "f_bytes_b64"
        type: "bytes"
        default: !!binary "AQID"
      - name: "f_string"
        type: "string"
        default: "hello"
      - name: "f_duration"
        type: "duration"
        default: "1h2m3s"
      - name: "f_timestamp"
        type: "timestamp"
        default: "2026-01-02T03:04:05Z"
      - name: "f_enum"
        type: "com.example.Status"
        default: "ACTIVE"
      - name: "dyn_field"
        type: "dyn"
      - name: "struct_field"
        type: "google.protobuf.Struct"
      - name: "list_value_field"
        type: "google.protobuf.ListValue"
      - name: "any_field"
        type: "any"
      - name: "func_field"
        type: "function<bool, int, string>"
      - name: "bool_w_f"
        type: "bool_wrapper"
      - name: "int_w_f"
        type: "int_wrapper"
      - name: "uint_w_f"
        type: "uint_wrapper"
      - name: "double_w_f"
        type: "double_wrapper"
      - name: "string_w_f"
        type: "string_wrapper"
      - name: "bytes_w_f"
        type: "bytes_wrapper"
      - name: "list_unspec_f"
        type: "list"
      - name: "map_unspec_f"
        type: "map"
      - name: "type_int_f"
        type: "type<int>"
      - name: "type_unspec_f"
        type: "type"
      - name: "type_param_f"
        type: "~T"
      - name: "abstract_params_f"
        type: "MyGeneric<int>"

# Comprehensive structured type syntax
- struct:
    name: "StructuredFieldTypes"
    fields:
      - name: "null_f"
        type:
          type_name: "null"
      - name: "bool_f"
        type:
          type_name: "bool"
      - name: "int_f"
        type:
          type_name: "int"
      - name: "uint_f"
        type:
          type_name: "uint"
      - name: "double_f"
        type:
          type_name: "double"
      - name: "string_f"
        type:
          type_name: "string"
      - name: "bytes_f"
        type:
          type_name: "bytes"
      - name: "any_f"
        type:
          type_name: "any"
      - name: "timestamp_f"
        type:
          type_name: "timestamp"
      - name: "duration_f"
        type:
          type_name: "duration"
      - name: "dyn_f"
        type:
          type_name: "dyn"
      - name: "bool_w_f"
        type:
          type_name: "bool_wrapper"
      - name: "int_w_f"
        type:
          type_name: "int_wrapper"
      - name: "uint_w_f"
        type:
          type_name: "uint_wrapper"
      - name: "double_w_f"
        type:
          type_name: "double_wrapper"
      - name: "string_w_f"
        type:
          type_name: "string_wrapper"
      - name: "bytes_w_f"
        type:
          type_name: "bytes_wrapper"
      - name: "list_value_f"
        type:
          type_name: "google.protobuf.ListValue"
      - name: "struct_f"
        type:
          type_name: "google.protobuf.Struct"
      - name: "type_int_f"
        type:
          type_name: "type"
          params:
            - type_name: "int"
      - name: "type_unspec_f"
        type:
          type_name: "type"
      - name: "list_str_f"
        type:
          type_name: "list"
          params:
            - type_name: "string"
      - name: "list_unspec_f"
        type:
          type_name: "list"
      - name: "map_str_dyn_f"
        type:
          type_name: "map"
          params:
            - type_name: "string"
            - type_name: "dyn"
      - name: "map_unspec_f"
        type:
          type_name: "map"
      - name: "func_f"
        type:
          type_name: "function"
          params:
            - type_name: "bool"
            - type_name: "int"
            - type_name: "string"
      - name: "type_param_f"
        type:
          type_name: "T"
          is_type_param: true
      - name: "abstract_f"
        type:
          type_name: "com.example.Status"
      - name: "abstract_params_f"
        type:
          type_name: "MyGeneric"
          params:
            - type_name: "int"

# Enum type definition
- enum:
    name: "com.example.OrderStatus"
    doc: "Order lifecycle state."
    aspects:
      aspect_a:
        name: "OrderStatusA"
      proto:
        name: "com.example.proto.OrderStatus"
        allow_alias: true
    constants:
      - name: "UNSPECIFIED"
        doc: "Default value."
      - name: "PENDING"
      - name: "SHIPPED"
        id: 10
        doc: "Shipped to customer."
        aspects:
          aspect_a:
            name: "shipped"
          proto:
            name: "STATUS_SHIPPED"
      - name: "DELIVERED"
        aspects:
          proto: {}

# Struct with one_of_fields
- struct:
    name: "com.example.OneofStruct"
    fields:
      - name: "a"
        type: "string"
      - one_of_fields:
          - name: "b"
            type: "int"
            doc: "Int option."
            default: 7
            aspects:
              proto:
                name: "proto_b"
                id: 20000
          - name: "c"
            type: "double"
      - one_of_fields: []
      - name: "d"
        type: "duration"

# Forward-compatibility: unrecognized keys, unknown aspects, and empty aspects
- struct:
    name: "ForwardCompatStruct"
    future_struct_prop: true
    aspects:
      stub_aspect: {}
      proto3: {}
      unknown_aspect:
        name: "Foo"
    fields:
      - future_oneof_prop: "ignored"
        one_of_fields:
          - name: "a"
            type: "int"
            future_field_prop: 42
            aspects:
              aspect_a:
                name: "ignored_in_proto"
              unknown_aspect:
                name: "Bar"
              stub_aspect: ~
- enum:
    name: "ForwardCompatEnum"
    future_enum_prop: true
    aspects:
      proto: {}
      proto2: {}
      stub_aspect: {}
    constants:
      - name: "A"
        future_constant_prop: 99
        aspects:
          proto2: {}
          stub_aspect: ~
