// Tests for external extensions added in an overlay.

edition = "2024";

package cel.cpp.testutil;

import "cel/expr/conformance/proto2/test_all_types.proto";

// Test message for external extensions.
message TestExternalExtensions {
  string string_field = 1;
  int64 int64_field = 2;
}

extend cel.expr.conformance.proto2.TestAllTypes {
  TestExternalExtensions test_external_extensions_message = 2001;
  string test_external_extensions_string = 2002;
  int64 test_external_extensions_int64 = 2003;
}

// Message scoped extension.
message ScopedTestExternalExtensions {
  extend cel.expr.conformance.proto2.TestAllTypes {
    TestExternalExtensions scoped_ext_message = 3001;
    string scoped_ext_string = 3002;
    int64 scoped_ext_int64 = 3003;
  }
}
